<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能问数助手</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg1: #0f172a;
    --bg2: #1e1b4b;
    --card: rgba(255, 255, 255, 0.06);
    --border: rgba(255, 255, 255, 0.12);
    --user-grad: linear-gradient(135deg, #6366f1, #8b5cf6);
    --ai-bg: #1e293b;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #8b5cf6;
  }
  html, body { height: 100%; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background:
      radial-gradient(1100px 700px at 15% 10%, rgba(76, 29, 149, 0.55) 0%, transparent 55%),
      radial-gradient(900px 650px at 85% 90%, rgba(49, 46, 129, 0.6) 0%, transparent 55%),
      linear-gradient(160deg, var(--bg1), var(--bg2));
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .chat-app {
    width: 100%;
    max-width: 960px;
    height: min(94vh, 820px);
    display: flex;
    flex-direction: column;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    overflow: hidden;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.03);
  }
  .logo {
    width: 40px; height: 40px;
    border-radius: 12px;
    background: var(--user-grad);
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 700; color: #fff;
    flex-shrink: 0;
  }
  header h1 { font-size: 16px; font-weight: 600; }
  header p { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .status {
    margin-left: auto;
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--muted);
    white-space: nowrap;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 8px #22c55e; }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  #messages::-webkit-scrollbar { width: 6px; }
  #messages::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 3px; }

  .msg { display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble {
    max-width: 85%;
    padding: 12px 16px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.7;
    word-break: break-word;
  }
  .msg.user .bubble {
    background: var(--user-grad);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg.ai .bubble {
    background: var(--ai-bg);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .bubble p { margin: 0 0 8px; }
  .bubble p:last-child { margin-bottom: 0; }

  /* SQL 展示区（可折叠） */
  .sql-block {
    margin-top: 10px;
    border: 1px solid rgba(139, 92, 246, 0.35);
    border-radius: 10px;
    overflow: hidden;
    background: rgba(0, 0, 0, 0.25);
  }
  .sql-toggle {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: rgba(139, 92, 246, 0.12);
    border: none;
    color: var(--accent);
    font-size: 12px;
    cursor: pointer;
    text-align: left;
  }
  .sql-toggle:hover { background: rgba(139, 92, 246, 0.2); }
  .sql-code {
    display: none;
    padding: 10px 12px;
    font-family: Consolas, "Courier New", monospace;
    font-size: 12px;
    color: #c4b5fd;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .sql-block.open .sql-code { display: block; }

  /* 数据表格 */
  .table-wrap {
    margin-top: 10px;
    max-height: 260px;
    overflow: auto;
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  .table-wrap::-webkit-scrollbar { width: 6px; height: 6px; }
  .table-wrap::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 3px; }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    min-width: 400px;
  }
  thead th {
    position: sticky;
    top: 0;
    background: rgba(99, 102, 241, 0.25);
    color: #fff;
    font-weight: 600;
    text-align: left;
    padding: 9px 12px;
    white-space: nowrap;
    z-index: 1;
  }
  tbody td {
    padding: 8px 12px;
    border-top: 1px solid var(--border);
    color: var(--text);
    white-space: nowrap;
  }
  tbody tr:nth-child(even) { background: rgba(255, 255, 255, 0.03); }
  tbody tr:hover { background: rgba(139, 92, 246, 0.1); }
  .empty-note {
    margin-top: 10px;
    font-size: 13px;
    color: var(--muted);
  }

  /* 思考中动画 */
  .typing { display: inline-flex; gap: 5px; align-items: center; padding: 6px 0; }
  .typing span {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--muted);
    animation: blink 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.3; } 40% { opacity: 1; } }

  /* 输入区 */
  .input-area {
    display: flex;
    gap: 10px;
    padding: 14px 20px;
    border-top: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.03);
  }
  .input-area input {
    flex: 1;
    padding: 12px 16px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.06);
    color: var(--text);
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  .input-area input:focus { border-color: var(--accent); }
  .input-area input::placeholder { color: var(--muted); }
  .input-area button {
    padding: 12px 22px;
    border: none;
    border-radius: 12px;
    background: var(--user-grad);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
  }
  .input-area button:hover { opacity: 0.9; }
  .input-area button:active { transform: scale(0.97); }
  .input-area button:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>
<div class="chat-app">
  <header>
    <div class="logo">问数</div>
    <div>
      <h1>智能问数助手</h1>
      <p>用自然语言查数据，自动生成 SQL 并展示结果表格</p>
    </div>
    <div class="status"><span class="dot"></span>服务在线</div>
  </header>

  <div id="messages"></div>

  <div class="input-area">
    <input id="input" type="text" placeholder="试试问：查询所有学生的姓名和年龄" autocomplete="off">
    <button id="sendBtn">发送</button>
  </div>
</div>

<script>
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');

let loading = false;

/* ---------- 消息渲染 ---------- */

function escapeHtml(text) {
  return String(text).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function addUserMsg(text) {
  const div = document.createElement('div');
  div.className = 'msg user';
  div.innerHTML = `<div class="bubble">${escapeHtml(text)}</div>`;
  messagesEl.appendChild(div);
  scrollBottom();
}

function addTyping() {
  const div = document.createElement('div');
  div.className = 'msg ai';
  div.id = 'typing';
  div.innerHTML = `<div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  messagesEl.appendChild(div);
  scrollBottom();
}

function removeTyping() {
  const t = document.getElementById('typing');
  if (t) t.remove();
}

function addAiMsg(data) {
  const div = document.createElement('div');
  div.className = 'msg ai';

  // 润色文本
  let html = `<div class="bubble">`;
  html += `<p>${escapeHtml(data.answer || '')}</p>`;

  // SQL 语句（可折叠）
  if (data.sql) {
    html += `<div class="sql-block">
      <button class="sql-toggle" onclick="this.parentElement.classList.toggle('open')">
        ▸ 查看生成的 SQL 语句
      </button>
      <div class="sql-code">${escapeHtml(data.sql)}</div>
    </div>`;
  }

  // 数据表格
  if (data.rows && data.rows.length > 0) {
    const cols = data.columns || [];
    html += `<div class="table-wrap"><table>
      <thead><tr>${cols.map(c => `<th>${escapeHtml(c)}</th>`).join('')}</tr></thead>
      <tbody>${data.rows.map(row =>
        `<tr>${cols.map(c => `<td>${escapeHtml(row[c] ?? '')}</td>`).join('')}</tr>`
      ).join('')}</tbody>
    </table></div>`;
  } else if (data.affected_rows !== null && data.affected_rows !== undefined) {
    html += `<div class="empty-note">操作已完成，共影响 ${data.affected_rows} 行数据。</div>`;
  } else {
    html += `<div class="empty-note">未查询到相关数据。</div>`;
  }

  html += `</div>`;
  div.innerHTML = html;
  messagesEl.appendChild(div);
  scrollBottom();
}

function addErrorMsg(errText) {
  const div = document.createElement('div');
  div.className = 'msg ai';
  div.innerHTML = `<div class="bubble"><p style="color:#f87171">出错了：${escapeHtml(errText)}</p></div>`;
  messagesEl.appendChild(div);
  scrollBottom();
}

function scrollBottom() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

/* ---------- 发送请求 ---------- */

async function send() {
  const text = inputEl.value.trim();
  if (!text || loading) return;

  inputEl.value = '';
  addUserMsg(text);
  addTyping();
  loading = true;
  sendBtn.disabled = true;

  try {
    const res = await fetch('/api/nl2sql', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query: text }),
    });
    const data = await res.json();
    removeTyping();
    if (!res.ok) {
      addErrorMsg(data.detail || `请求失败（HTTP ${res.status}）`);
    } else {
      addAiMsg(data);
    }
  } catch (err) {
    removeTyping();
    addErrorMsg(err.message || '网络异常');
  } finally {
    loading = false;
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

sendBtn.addEventListener('click', send);
inputEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });
</script>
</body>
</html>
